<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ನಮ್ಮ ಸ್ವಂತ ರೋಬೋಟ್</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: #0b1120;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #0f172a;
      padding: 12px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .title { font-size: 16px; font-weight: 700; color: #38bdf8; }
    .sub { font-size: 12px; color: #4ade80; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; }
    button {
      padding: 8px 11px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .g { background: #16a34a; }
    .r { background: #dc2626; }
    .a { background: #d97706; }
    .y { background: #334155; }

    #chat {
      flex: 1;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 85px;
    }
    .msg {
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      max-width: 88%;
    }
    .bot {
      align-self: flex-start;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      max-width: 96%;
      width: 100%;
    }
    pre {
      background: #020617;
      border: 1px solid #38bdf8;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      color: #e2e8f0;
      font-size: 12px;
      margin-top: 8px;
    }
    .copybtn {
      margin-top: 6px;
      background: #0284c7;
      padding: 6px 10px;
      font-size: 12px;
    }

    #bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0f172a;
      border-top: 1px solid #334155;
      padding: 10px;
      display: flex;
      gap: 8px;
      z-index: 20;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      font-size: 15px;
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="title">ನಮ್ಮ ಸ್ವಂತ ರೋಬೋಟ್</div>
    <div class="sub" id="st">ಸಿದ್ಧವಾಗಿದೆ</div>
  </div>
  <div class="btns">
    <button class="g" id="contBtn" onclick="toggleCont()">ನಿರಂತರ ಆನ್/ಆಫ್</button>
    <button class="a" onclick="goBack()">ಹಿಂದಕ್ಕೆ</button>
    <button class="y" onclick="document.getElementById('fp').click()">ಅಪ್ಲೋಡ್</button>
    <button class="y" onclick="clearAll()">ಅಳಿಸಿ</button>
  </div>
</header>

<div id="chat"></div>
<input type="file" id="fp" multiple style="display:none" onchange="pickedFile(event)" />

<div id="bar">
  <button class="g" id="micBtn" onclick="listenOnce()">ಮೈಕ್</button>
  <input id="inp" type="text" placeholder="ಇಲ್ಲಿ ಟೈಪ್ ಮಾಡಿ ಅಥವಾ ಮಾತನಾಡಿ..." onkeydown="if(event.key==='Enter') sendNow()" />
  <button onclick="sendNow()">ಕಳುಹಿಸಿ</button>
</div>

<script>
  var chatEl = document.getElementById("chat");
  var inpEl = document.getElementById("inp");
  var stEl = document.getElementById("st");
  var contBtn = document.getElementById("contBtn");
  var micBtn = document.getElementById("micBtn");

  var notes = [];
  var isCont = false;
  var recObj = null;

  function showMsg(who, text, codeStr) {
    var box = document.createElement("div");
    box.className = "msg " + (who === "user" ? "user" : "bot");
    box.appendChild(document.createTextNode(text));

    if (codeStr) {
      var pre = document.createElement("pre");
      pre.textContent = codeStr;
      box.appendChild(pre);

      var cbtn = document.createElement("button");
      cbtn.className = "copybtn";
      cbtn.textContent = "ಕೋಡ್ ಕಾಪಿ ಮಾಡಿ";
      cbtn.onclick = function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(codeStr);
        }
        cbtn.textContent = "ಕಾಪಿ ಆಗಿದೆ!";
        setTimeout(function () { cbtn.textContent = "ಕೋಡ್ ಕಾಪಿ ಮಾಡಿ"; }, 1500);
      };
      box.appendChild(cbtn);
    }

    chatEl.appendChild(box);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function speakOut(text) {
    try {
      if (!("speechSynthesis" in window)) {
        if (isCont) setTimeout(startRec, 400);
        return;
      }
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "kn-IN";
      u.onend = u.onerror = function () {
        if (isCont) setTimeout(startRec, 400);
      };
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function botSay(text, codeStr) {
    showMsg("bot", text, codeStr);
    speakOut(text);
  }

  function goBack() {
    try { history.back(); } catch (e) {}
  }

  function clearAll() {
    notes = [];
    chatEl.innerHTML = "";
    botSay("ಹೊಸದಾಗಿ ಶುರುವಾಗಿದೆ. ಏನು ಬೇಕು ಹೇಳಿ?");
  }

  function pickedFile(ev) {
    var files = (ev && ev.target && ev.target.files) || [];
    if (!files.length) return;
    var names = [];
    for (var i = 0; i < files.length; i++) names.push(files[i].name);
    botSay("ಫೈಲ್ ಆಯ್ಕೆಯಾಗಿದೆ: " + names.join(", "));
  }

  function makeSampleCode() {
    return [
      "<!DOCTYPE html>",
      "<html>",
      "<head><meta charset='UTF-8'><title>My App</title></head>",
      "<body style='font-family:sans-serif;padding:20px;'>",
      "  <h3>ನನ್ನ ಆ್ಯಪ್</h3>",
      "  <input id='t' placeholder='ಬರೆಯಿರಿ'>",
      "  <button onclick='p.innerText=t.value'>ತೋರಿಸಿ</button>",
      "  <p id='p'></p>",
      "</body>",
      "</html>"
    ].join("\n");
  }

  function think(q) {
    var s = q.toLowerCase();

    if (s.indexOf("ನೆನಪಿಟ್ಟುಕೋ") !== -1) {
      notes.push(q);
      return { text: "ಸೇವ್ ಮಾಡಿಕೊಂಡಿದ್ದೇನೆ: " + q };
    }
    if (s.indexOf("ಏನು ಸೇವ್") !== -1 || s.indexOf("ನೆನಪು") !== -1) {
      return { text: notes.length ? notes.join("\n") : "ಇನ್ನೂ ಏನೂ ಸೇವ್ ಆಗಿಲ್ಲ." };
    }
    if (s.indexOf("ಹಿಂದಕ್ಕೆ") !== -1 || s.indexOf("ಬ್ಯಾಕ್") !== -1) {
      setTimeout(goBack, 300);
      return { text: "ಹಿಂದಕ್ಕೆ ಹೋಗುತ್ತಿದ್ದೇನೆ." };
    }
    if (s.indexOf("ಅಪ್ಲೋಡ್") !== -1 || s.indexOf("ಗ್ಯಾಲರಿ") !== -1) {
      document.getElementById("fp").click();
      return { text: "ಫೈಲ್ ಆಯ್ಕೆ ತೆರೆದಿದ್ದೇನೆ." };
    }
    if (s.indexOf("youtube") !== -1 || s.indexOf("ಯೂಟ್ಯೂಬ್") !== -1) {
      window.open("[https://studio.youtube.com](https://studio.youtube.com)", "_blank");
      return { text: "YouTube Studio ತೆರೆದಿದ್ದೇನೆ." };
    }
    if (s.indexOf("instagram") !== -1 || s.indexOf("ಇನ್ಸ್ಟಾಗ್ರಾಂ") !== -1) {
      window.open("[https://www.instagram.com/](https://www.instagram.com/)", "_blank");
      return { text: "Instagram ತೆರೆದಿದ್ದೇನೆ." };
    }
    if (s.indexOf("facebook") !== -1 || s.indexOf("ಫೇಸ್ಬುಕ್") !== -1) {
      window.open("[https://www.facebook.com/](https://www.facebook.com/)", "_blank");
      return { text: "Facebook ತೆರೆದಿದ್ದೇನೆ." };
    }
    if (s.indexOf("ಕೋಡ್") !== -1 || s.indexOf("code") !== -1) {
      return { text: "ಕೋಡ್ ಸಿದ್ಧವಾಗಿದೆ. ಕೆಳಗಿನ ಬಟನ್ ಒತ್ತಿ ಕಾಪಿ ಮಾಡಿ:", code: makeSampleCode() };
    }
    if (s.indexOf("ಹಾಡು") !== -1 || s.indexOf("song") !== -1) {
      return {
        text: "ಕನಸಿನ ದಾರಿಯಲಿ ನಡೆಯುವಾಗ,\nನಂಬಿಕೆಯ ಬೆಳಕು ಜೊತೆಗಿರಲಿ,\nನಮ್ಮದೇ ಸ್ವಂತದ ಹಾದಿಯಲಿ,\nಗೆಲುವಿನ ಹಾಡನು ಹಾಡೋಣ."
      };
    }

    return {
      text: "ನೀವು ಕೇಳಿದ್ದು: " + q + "\nಹೆಚ್ಚಿನ ಮಾಹಿತಿಗೆ ಸರ್ಚ್ ಲಿಂಕ್: [https://www.google.com/search?q=](https://www.google.com/search?q=)" + encodeURIComponent(q)
    };
  }

  function sendNow(forcedText) {
    var val = (forcedText !== undefined ? forcedText : inpEl.value).trim();
    if (!val) return;
    if (forcedText === undefined) inpEl.value = "";
    showMsg("user", val);
    var ans = think(val);
    botSay(ans.text, ans.code);
  }

  function startRec() {
    try {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        stEl.textContent = "ಈ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಮೈಕ್ ಬೆಂಬಲವಿಲ್ಲ";
        return;
      }
      recObj = new SR();
      recObj.lang = "kn-IN";
      recObj.onstart = function () {
        stEl.textContent = "ಕೇಳುತ್ತಿದ್ದೇನೆ...";
        micBtn.className = "r";
      };
      recObj.onresult = function (e) {
        var said = e.results[0][0].transcript;
        sendNow(said);
      };
      recObj.onend = recObj.onerror = function () {
        micBtn.className = "g";
        stEl.textContent = isCont ? "ನಿರಂತರ ಮೋಡ್ ಆನ್" : "ಸಿದ್ಧವಾಗಿದೆ";
        if (isCont) setTimeout(startRec, 500);
      };
      recObj.start();
    } catch (e) {}
  }

  function listenOnce() {
    isCont = false;
    contBtn.className = "g";
    startRec();
  }

  function toggleCont() {
    isCont = !isCont;
    if (isCont) {
      contBtn.className = "r";
      stEl.textContent = "ನಿರಂತರ ಮೋಡ್ ಆನ್";
      startRec();
    } else {
      contBtn.className = "g";
      stEl.textContent = "ನಿರಂತರ ಮೋಡ್ ಆಫ್";
      try { if (recObj) recObj.stop(); } catch (e) {}
    }
  }

  showMsg("bot", "ನಮಸ್ಕಾರ! ರೋಬೋಟ್ ಸಿದ್ಧವಾಗಿದೆ. ಕೆಳಗೆ ಟೈಪ್ ಮಾಡಿ 'ಕಳುಹಿಸಿ' ಒತ್ತಿ ಅಥವಾ 'ಮೈಕ್' ಒತ್ತಿ ಮಾತನಾಡಿ.");
</script>
</body>
</html>
