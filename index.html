<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ನಮ್ಮ ಸ್ವಂತ Gemini ರೋಬೋಟ್</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: #0b1120;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #0f172a;
      padding: 12px;
      border-bottom: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .title { font-size: 16px; font-weight: 700; color: #38bdf8; }
    .sub { font-size: 12px; color: #4ade80; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; }
    button {
      padding: 8px 11px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .g { background: #16a34a; }
    .r { background: #dc2626; }
    .a { background: #d97706; }
    .y { background: #334155; }

    .key-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .key-row input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      font-size: 13px;
    }

    #chat {
      flex: 1;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 88px;
    }
    .msg {
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      max-width: 88%;
    }
    .bot {
      align-self: flex-start;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      max-width: 96%;
      width: 100%;
    }
    .code-wrap {
      margin-top: 10px;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      background: #020617;
      overflow: hidden;
    }
    .code-bar {
      background: #0f172a;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
    }
    pre {
      margin: 0;
      padding: 10px;
      overflow-x: auto;
      color: #e2e8f0;
      font-size: 12px;
      line-height: 1.45;
    }
    .copybtn {
      background: #0284c7;
      padding: 5px 10px;
      font-size: 12px;
    }

    #bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0f172a;
      border-top: 1px solid #334155;
      padding: 10px;
      display: flex;
      gap: 8px;
      z-index: 20;
    }
    #inp {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      font-size: 15px;
    }
  </style>
</head>
<body>

<header>
  <div class="top">
    <div>
      <div class="title">ನಮ್ಮ ಸ್ವಂತ Gemini ರೋಬೋಟ್</div>
      <div class="sub" id="st">ಸಿದ್ಧವಾಗಿದೆ</div>
    </div>
    <div class="btns">
      <button class="g" id="contBtn" onclick="toggleCont()">ನಿರಂತರ ಆನ್/ಆಫ್</button>
      <button class="a" onclick="goBack()">ಹಿಂದಕ್ಕೆ</button>
      <button class="y" onclick="document.getElementById('fp').click()">ಅಪ್ಲೋಡ್</button>
      <button class="y" onclick="clearAll()">ಅಳಿಸಿ</button>
    </div>
  </div>
  <div class="key-row">
    <input type="password" id="apiKeyBox" placeholder="Gemini API Key ಇಲ್ಲಿ ಹಾಕಿ (ಆಟೋ ಸೇವ್ ಆಗುತ್ತದೆ)" />
  </div>
</header>

<div id="chat"></div>
<input type="file" id="fp" multiple style="display:none" onchange="pickedFile(event)" />

<div id="bar">
  <button class="g" id="micBtn" onclick="listenOnce()">ಮೈಕ್</button>
  <input id="inp" type="text" placeholder="ಏನು ಬೇಕಾದರೂ ಕೇಳಿ ಅಥವಾ ಮಾತನಾಡಿ..." onkeydown="if(event.key==='Enter') sendNow()" />
  <button onclick="sendNow()">ಕಳುಹಿಸಿ</button>
</div>

<script>
  // ಬೇಕಾದರೆ ನಿಮ್ಮ Gemini API Key ಅನ್ನು ಇಲ್ಲಿ ನೇರವಾಗಿ ಹಾಕಿ ಉಳಿಸಬಹುದು:
  var DEFAULT_GEMINI_API_KEY = "";

  var KEY_STORE = "robot_gemini_api_key_v1";
  var MEM_STORE = "robot_gemini_chat_mem_v1";

  var chatEl = document.getElementById("chat");
  var inpEl = document.getElementById("inp");
  var stEl = document.getElementById("st");
  var contBtn = document.getElementById("contBtn");
  var micBtn = document.getElementById("micBtn");
  var apiKeyBox = document.getElementById("apiKeyBox");

  var historyList = [];
  try {
    historyList = JSON.parse(localStorage.getItem(MEM_STORE) || "[]");
    if (!Array.isArray(historyList)) historyList = [];
  } catch (e) { historyList = []; }

  var savedKey = "";
  try { savedKey = localStorage.getItem(KEY_STORE) || ""; } catch (e) {}
  apiKeyBox.value = savedKey || DEFAULT_GEMINI_API_KEY;

  apiKeyBox.addEventListener("input", function () {
    try { localStorage.setItem(KEY_STORE, apiKeyBox.value.trim()); } catch (e) {}
  });

  function getApiKey() {
    var k = (apiKeyBox.value || "").trim();
    if (k) return k;
    try { k = (localStorage.getItem(KEY_STORE) || "").trim(); } catch (e) {}
    return k || DEFAULT_GEMINI_API_KEY.trim();
  }

  function saveHistory() {
    try { localStorage.setItem(MEM_STORE, JSON.stringify(historyList.slice(-40))); } catch (e) {}
  }

  var isCont = false;
  var recObj = null;

  function renderBotMessage(text) {
    var box = document.createElement("div");
    box.className = "msg bot";

    var fence = String.fromCharCode(96, 96, 96);
    if (text.indexOf(fence) !== -1) {
      var parts = text.split(fence);
      for (var i = 0; i < parts.length; i++) {
        if (i % 2 === 1) {
          var cleanCode = parts[i].replace(/^[a-zA-Z0-9_-]+\n/, "");
          var wrap = document.createElement("div");
          wrap.className = "code-wrap";

          var bar = document.createElement("div");
          bar.className = "code-bar";
          var lbl = document.createElement("span");
          lbl.style.color = "#38bdf8";
          lbl.style.fontSize = "12px";
          lbl.textContent = "FULL CODE";

          var cbtn = document.createElement("button");
          cbtn.className = "copybtn";
          cbtn.textContent = "ಕೋಡ್ ಕಾಪಿ ಮಾಡಿ";
          (function (codeText, btn) {
            btn.onclick = function () {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(codeText);
              }
              btn.textContent = "ಕಾಪಿ ಆಗಿದೆ!";
              setTimeout(function () { btn.textContent = "ಕೋಡ್ ಕಾಪಿ ಮಾಡಿ"; }, 1500);
            };
          })(cleanCode, cbtn);

          bar.appendChild(lbl);
          bar.appendChild(cbtn);

          var pre = document.createElement("pre");
          pre.textContent = cleanCode;

          wrap.appendChild(bar);
          wrap.appendChild(pre);
          box.appendChild(wrap);
        } else if (parts[i].trim()) {
          var sp = document.createElement("div");
          sp.textContent = parts[i].trim();
          box.appendChild(sp);
        }
      }
    } else {
      box.textContent = text;
    }

    chatEl.appendChild(box);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function showUser(text) {
    var box = document.createElement("div");
    box.className = "msg user";
    box.textContent = text;
    chatEl.appendChild(box);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function speakOut(text) {
    try {
      if (!("speechSynthesis" in window)) {
        if (isCont) setTimeout(startRec, 400);
        return;
      }
      window.speechSynthesis.cancel();
      var fence = String.fromCharCode(96, 96, 96);
      var spoken = text.split(fence)[0].replace(/[*#]/g, "").trim() || "ಉತ್ತರ ಸಿದ್ಧವಾಗಿದೆ.";
      var u = new SpeechSynthesisUtterance(spoken);
      u.lang = /[\u0C80-\u0CFF]/.test(spoken) ? "kn-IN" : "en-IN";
      u.onend = u.onerror = function () {
        if (isCont) setTimeout(startRec, 400);
      };
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function botSay(text) {
    historyList.push({ role: "model", text: text });
    saveHistory();
    renderBotMessage(text);
    speakOut(text);
  }

  function goBack() {
    try { history.back(); } catch (e) {}
  }

  function clearAll() {
    historyList = [];
    try { localStorage.removeItem(MEM_STORE); } catch (e) {}
    chatEl.innerHTML = "";
    botSay("ಹೊಸದಾಗಿ ಶುರುವಾಗಿದೆ. ಏನು ಕೇಳಬೇಕು ಅಥವಾ ಏನು ಮಾಡಬೇಕು ಹೇಳಿ?");
  }

  function pickedFile(ev) {
    var files = (ev && ev.target && ev.target.files) || [];
    if (!files.length) return;
    var names = [];
    for (var i = 0; i < files.length; i++) names.push(files[i].name);
    botSay("ಫೈಲ್ ಆಯ್ಕೆಯಾಗಿದೆ: " + names.join(", "));
  }

  function checkQuickActions(q) {
    var s = q.toLowerCase();
    if (s.indexOf("ಹಿಂದಕ್ಕೆ") !== -1 || s.indexOf("ಬ್ಯಾಕ್") !== -1) {
      setTimeout(goBack, 300);
      return "ಹಿಂದಕ್ಕೆ ಹೋಗುತ್ತಿದ್ದೇನೆ.";
    }
    if (s.indexOf("ಅಪ್ಲೋಡ್") !== -1 || s.indexOf("ಗ್ಯಾಲರಿ") !== -1) {
      document.getElementById("fp").click();
      return "ಫೈಲ್ ಆಯ್ಕೆ ತೆರೆದಿದ್ದೇನೆ.";
    }
    if (s.indexOf("youtube") !== -1 || s.indexOf("ಯೂಟ್ಯೂಬ್") !== -1) {
      window.open("https://studio.youtube.com", "_blank");
      return "YouTube Studio ತೆರೆದಿದ್ದೇನೆ.";
    }
    if (s.indexOf("instagram") !== -1 || s.indexOf("ಇನ್ಸ್ಟಾಗ್ರಾಂ") !== -1) {
      window.open("https://www.instagram.com/", "_blank");
      return "Instagram ತೆರೆದಿದ್ದೇನೆ.";
    }
    if (s.indexOf("facebook") !== -1 || s.indexOf("ಫೇಸ್ಬುಕ್") !== -1) {
      window.open("https://www.facebook.com/", "_blank");
      return "Facebook ತೆರೆದಿದ್ದೇನೆ.";
    }
    return null;
  }

  async function askGemini(userText) {
    var actionReply = checkQuickActions(userText);
    if (actionReply) {
      botSay(actionReply);
      return;
    }

    var key = getApiKey();
    if (!key) {
      botSay("ಮೇಲೆ ಇರುವ ಬಾಕ್ಸ್‌ನಲ್ಲಿ ನಿಮ್ಮ Gemini API Key ಹಾಕಿ. ಒಮ್ಮೆ ಹಾಕಿದರೆ ಅದು ಆಟೋಮೆಟಿಕ್ ಸೇವ್ ಆಗುತ್ತದೆ ಮತ್ತು ನನ್ನಂತೆಯೇ ಎಲ್ಲಾ ಪ್ರಶ್ನೆಗಳಿಗೂ, ಕೋಡ್‌ಗೂ, ಹಾಡಿಗೂ ನಿಖರ ಉತ್ತರ ನೀಡುತ್ತದೆ.");
      return;
    }

    stEl.textContent = "Gemini ಯೋಚಿಸುತ್ತಿದೆ...";

    var contents = [];
    var recent = historyList.slice(-12);
    for (var i = 0; i < recent.length; i++) {
      contents.push({
        role: recent[i].role === "user" ? "user" : "model",
        parts: [{ text: recent[i].text }]
      });
    }

    try {
      var url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + encodeURIComponent(key);
      var res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: {
            parts: [{
              text: "ನೀವು ಅನಿಲ್ (List) ಅವರ ಸ್ನೇಹಪರ ಮತ್ತು ಬುದ್ಧಿವಂತ AI ರೋಬೋಟ್ ಸಹಾಯಕ. ಬಳಕೆದಾರರ ಹೆಸರು ಅನಿಲ್ ರಾಥೋಡ್ (List) ಎಂಬುದನ್ನು ನೆನಪಿಟ್ಟುಕೊಳ್ಳಿ. ಅವರು ಯಾವ ಭಾಷೆಯಲ್ಲಿ ಕೇಳುತ್ತಾರೋ ಅದೇ ಭಾಷೆಯಲ್ಲಿ (ಕನ್ನಡ/ಇಂಗ್ಲಿಷ್/ಹಿಂದಿ) ಸ್ಪಷ್ಟ, ನೇರ ಮತ್ತು ಸಹಾಯಕ ಉತ್ತರ ನೀಡಿ. HTML ಅಥವಾ ಆ್ಯಪ್ ಕೋಡ್ ಕೇಳಿದರೆ ಸಂಪೂರ್ಣ, ವರ್ಕ್ ಆಗುವ ಕೋಡ್ ಅನ್ನು ```html ... ``` ಒಳಗೆ ನೀಡಿ. ಉದ್ದವಾದ URL ಲಿಂಕ್‌ಗಳನ್ನು ಹಾಕಬೇಡಿ."
            }]
          },
          contents: contents
        })
      });

      var data = await res.json();
      stEl.textContent = isCont ? "ನಿರಂತರ ಮೋಡ್ ಆನ್" : "ಸಿದ್ಧವಾಗಿದೆ";

      if (data && data.candidates && data.candidates[0] && data.candidates[0].content) {
        var answer = data.candidates[0].content.parts[0].text;
        botSay(answer);
      } else if (data && data.error && data.error.message) {
        botSay("API ದೋಷ: " + data.error.message);
      } else {
        botSay("ಉತ್ತರ ಪಡೆಯಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. API Key ಸರಿಯಾಗಿದೆಯೇ ಎಂದು ಪರಿಶೀಲಿಸಿ.");
      }
    } catch (err) {
      stEl.textContent = "ಸಿದ್ಧವಾಗಿದೆ";
      botSay("ಇಂಟರ್ನೆಟ್ ಅಥವಾ API ಸಂಪರ್ಕದಲ್ಲಿ ತೊಂದರೆಯಾಗಿದೆ. ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ.");
    }
  }

  function sendNow(forcedText) {
    var val = (forcedText !== undefined ? forcedText : inpEl.value).trim();
    if (!val) return;
    if (forcedText === undefined) inpEl.value = "";
    historyList.push({ role: "user", text: val });
    saveHistory();
    showUser(val);
    askGemini(val);
  }

  function startRec() {
    try {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        stEl.textContent = "ಈ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಮೈಕ್ ಬೆಂಬಲವಿಲ್ಲ";
        return;
      }
      recObj = new SR();
      recObj.lang = "kn-IN";
      recObj.onstart = function () {
        stEl.textContent = "ಕೇಳುತ್ತಿದ್ದೇನೆ...";
        micBtn.className = "r";
      };
      recObj.onresult = function (e) {
        var said = e.results[0][0].transcript;
        sendNow(said);
      };
      recObj.onend = recObj.onerror = function () {
        micBtn.className = "g";
        stEl.textContent = isCont ? "ನಿರಂತರ ಮೋಡ್ ಆನ್" : "ಸಿದ್ಧವಾಗಿದೆ";
        if (isCont) setTimeout(startRec, 500);
      };
      recObj.start();
    } catch (e) {}
  }

  function listenOnce() {
    isCont = false;
    contBtn.className = "g";
    startRec();
  }

  function toggleCont() {
    isCont = !isCont;
    if (isCont) {
      contBtn.className = "r";
      stEl.textContent = "ನಿರಂತರ ಮೋಡ್ ಆನ್";
      startRec();
    } else {
      contBtn.className = "g";
      stEl.textContent = "ನಿರಂತರ ಮೋಡ್ ಆಫ್";
      try { if (recObj) recObj.stop(); } catch (e) {}
    }
  }

  for (var i = 0; i < historyList.length; i++) {
    if (historyList[i].role === "user") showUser(historyList[i].text);
    else renderBotMessage(historyList[i].text);
  }
  if (historyList.length === 0) {
    renderBotMessage("ನಮಸ್ಕಾರ ಅನಿಲ್! ನಿಮ್ಮ ಸ್ವಂತ Gemini ರೋಬೋಟ್ ಸಿದ್ಧವಾಗಿದೆ. ಮೇಲೆ API Key ಹಾಕಿ ಏನು ಬೇಕಾದರೂ ಕೇಳಿ!");
  }
</script>
</body>
</html>
