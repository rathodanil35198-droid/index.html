<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ನಿರಂತರ ರೋಬೋಟ್ — ಪೂರ್ಣ ಆವೃತ್ತಿ</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: linear-gradient(160deg, #060b19, #0f172a 60%, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(15, 23, 42, 0.96);
      padding: 12px 14px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .title { font-size: 16px; font-weight: 700; color: #38bdf8; }
    .status { font-size: 12px; color: #4ade80; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; }
    button {
      padding: 8px 11px; border-radius: 8px; border: none;
      background: #2563eb; color: #fff; font-weight: 600;
      font-size: 13px; cursor: pointer;
    }
    .btn-green { background: #16a34a; }
    .btn-red { background: #dc2626; }
    .btn-amber { background: #d97706; }
    .btn-gray { background: #334155; }

    #chat {
      flex: 1; padding: 14px; display: flex;
      flex-direction: column; gap: 12px; padding-bottom: 92px;
    }
    .msg {
      padding: 12px 14px; border-radius: 14px;
      line-height: 1.55; font-size: 14px; white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end; background: #2563eb;
      color: #fff; max-width: 88%; border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start; background: #1e293b;
      border: 1px solid #334155; width: 100%; max-width: 96%;
      border-bottom-left-radius: 4px;
    }

    .code-box {
      margin-top: 10px; border: 1px solid #38bdf8;
      border-radius: 10px; overflow: hidden; background: #050811;
    }
    .code-top {
      background: #0f172a; padding: 8px 12px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #1e293b;
    }
    .copy-btn { background: #0284c7; padding: 5px 10px; font-size: 12px; border-radius: 6px; }
    .copy-btn.ok { background: #16a34a; }
    pre {
      margin: 0; padding: 12px; overflow-x: auto;
      color: #e2e8f0; font-size: 12.5px; line-height: 1.45;
    }

    #bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #0f172a; border-top: 1px solid #334155;
      padding: 10px; display: flex; gap: 8px; z-index: 20;
    }
    input {
      flex: 1; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #475569; background: #1e293b;
      color: #fff; font-size: 15px;
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="title">🤖 ನಿರಂತರ ರೋಬೋಟ್</div>
    <div class="status" id="statusText">ಸಿದ್ಧವಾಗಿದೆ • ಕೋಡ್ + ಆ್ಯಕ್ಷನ್ + ನಿರಂತರ ಮಾತು</div>
  </div>
  <div class="btns">
    <button class="btn-green" id="autoBtn" onclick="toggleContinuous()">🔁 ನಿರಂತರ ಆನ್/ಆಫ್</button>
    <button class="btn-amber" onclick="history.back()">⬅ ಹಿಂದಕ್ಕೆ</button>
    <button class="btn-gray" onclick="document.getElementById('filePick').click()">📁 ಅಪ್ಲೋಡ್</button>
    <button class="btn-gray" onclick="clearChat()">ಅಳಿಸಿ</button>
  </div>
</header>

<div id="chat"></div>
<input type="file" id="filePick" accept="image/*,video/*,audio/*,.html,.txt" multiple style="display:none" onchange="onFilePick(event)" />

<div id="bar">
  <button class="btn-green" id="micBtn" onclick="startOnce()">🎤</button>
  <input id="inp" type="text" placeholder="ಹೇಳಿ ಅಥವಾ ಬರೆಯಿರಿ (ಕೋಡ್, Instagram, ಅಪ್ಲೋಡ್, ಸರ್ಚ್)..." onkeydown="if(event.key==='Enter') sendText()" />
  <button onclick="sendText()">ಕಳುಹಿಸಿ</button>
</div>

<script>
  const MEM_KEY = "continuous_robot_mem_v2";
  const chat = document.getElementById("chat");
  const inp = document.getElementById("inp");
  const statusText = document.getElementById("statusText");
  const autoBtn = document.getElementById("autoBtn");
  const micBtn = document.getElementById("micBtn");

  let memory = JSON.parse(localStorage.getItem(MEM_KEY) || "[]");
  let continuousMode = false;
  let isSpeaking = false;
  let rec = null;

  function save() {
    localStorage.setItem(MEM_KEY, JSON.stringify(memory.slice(-60)));
  }

  function clearChat() {
    memory = [];
    localStorage.removeItem(MEM_KEY);
    chat.innerHTML = "";
    reply("ಹೊಸದಾಗಿ ಶುರು ಮಾಡಿದ್ದೇನೆ. ಹೇಳಿ, ಏನು ಕೆಲಸ ಮಾಡಬೇಕು?");
  }

  function onFilePick(e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    const names = files.map(f => f.name).join(", ");
    reply(`ಗ್ಯಾಲರಿ/ಫೈಲ್‌ನಿಂದ ಆಯ್ಕೆಯಾಗಿದೆ: ${names}. ಈಗ Instagram/YouTube/Facebook ತೆರೆಯಬೇಕಾ? ಹೇಳಿ.`);
  }

  window.copyCode = function(btn, encoded) {
    navigator.clipboard.writeText(decodeURIComponent(encoded)).then(() => {
      btn.textContent = "✅ ಕಾಪಿ ಆಗಿದೆ";
      btn.classList.add("ok");
      setTimeout(() => {
        btn.textContent = "📋 ಕಾಪಿ ಕೋಡ್";
        btn.classList.remove("ok");
      }, 1800);
    });
  };

  function addMsg(role, text) {
    const d = document.createElement("div");
    d.className = `msg ${role}`;

    if (text.includes("```")) {
      const parts = text.split("```");
      parts.forEach((p, i) => {
        if (i % 2 === 1) {
          const code = p.replace(/^[a-zA-Z0-9_-]+\n/, "");
          const box = document.createElement("div");
          box.className = "code-box";
          box.innerHTML = `
            <div class="code-top">
              <span style="color:#38bdf8;font-size:12px;font-weight:700;">FULL CODE</span>
              <button class="copy-btn" onclick="copyCode(this, '${encodeURIComponent(code)}')">📋 ಕಾಪಿ ಕೋಡ್</button>
            </div>
            <pre></pre>
          `;
          box.querySelector("pre").textContent = code;
          div.appendChild(box);
        } else if (p.trim()) {
          const span = document.createElement("span");
          span.textContent = p;
          div.appendChild(span);
        }
      });
    } else {
      div.textContent = text;
    }

    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  function speakThenListen(text) {
    if (!("speechSynthesis" in window)) {
      if (continuousMode) startListen();
      return;
    }
    window.speechSynthesis.cancel();
    isSpeaking = true;
    statusText.textContent = "🔊 ಮಾತನಾಡುತ್ತಿದ್ದೇನೆ...";

    const cleanSpoken = text.replace(/```[\s\S]*?```/g, "ಕೋಡ್ ಸಿದ್ಧವಾಗಿದೆ, ಕೆಳಗೆ ಕಾಪಿ ಬಟನ್ ಇದೆ.").replace(/[*#]/g, "");
    const u = new SpeechSynthesisUtterance(cleanSpoken);
    u.lang = /[\u0C80-\u0CFF]/.test(cleanSpoken) ? "kn-IN" : "en-IN";
    u.onend = u.onerror = () => {
      isSpeaking = false;
      statusText.textContent = continuousMode ? "👂 ನಿರಂತರ ಕೇಳುತ್ತಿದ್ದೇನೆ..." : "ಸಿದ್ಧವಾಗಿದೆ";
      if (continuousMode) {
        setTimeout(() => startListen(), 400);
      }
    };
    window.speechSynthesis.speak(u);
  }

  function reply(text) {
    memory.push({ role: "bot", text });
    save();
    addMsg("bot", text);
    speakThenListen(text);
  }

  function buildAppCode(reqText) {
    const t = reqText.toLowerCase();
    const hasUpload = t.includes("ಅಪ್ಲೋಡ್") || t.includes("ಗ್ಯಾಲರಿ") || t.includes("upload");
    const uploadHtml = hasUpload
      ? `<input type="file" accept="image/*,video/*" onchange="preview.innerText = this.files[0]?.name || ''"><p id="preview"></p>`
      : `<input id="note" placeholder="ಟಿಪ್ಪಣಿ ಬರೆಯಿರಿ"><button onclick="out.innerText = note.value">ಸೇವ್ ಮಾಡಿ</button><p id="out"></p>`;

    return `ನಿಮ್ಮ ಅಪ್ಲಿಕೇಶನ್‌ಗೆ ಬೇಕಾದ ಫೀಚರ್‌ಗಳೊಂದಿಗೆ ಸಂಪೂರ್ಣ ಕೋಡ್ ಸಿದ್ಧವಾಗಿದೆ (ಮೇಲೆ "📋 ಕಾಪಿ ಕೋಡ್" ಒತ್ತಿ ಕಾಪಿ ಮಾಡಿ):\n\`\`\`html\n<!DOCTYPE html>\n<html lang="kn">\n<head>\n  <meta charset="UTF-8" />\n  <meta name="viewport" content="width=device-width, initial-scale=1.0" />\n  <title>ಸ್ವಂತ ಅಪ್ಲಿಕೇಶನ್</title>\n  <style>\n    body { font-family: sans-serif; padding: 20px; background: #0f172a; color: #fff; }\n    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; font-size: 16px; }\n    button { background: #2563eb; color: #fff; border: none; font-weight: bold; }\n  </style>\n</head>\n<body>\n  <h2>ನನ್ನ ಮೊಬೈಲ್ ಆ್ಯಪ್</h2>\n  ${uploadHtml}\n  <button onclick="history.back()">⬅ ಹಿಂದಕ್ಕೆ</button>\n</body>\n</html>\n\`\`\``;
  }

  function processCommand(userText) {
    const low = userText.toLowerCase();

    if (low.includes("ಹೆಸರು") || low.includes("ಕೆಲಸ")) {
      return "ನನ್ನ ಹೆಸರು 'ನಿರಂತರ ರೋಬೋಟ್'. ನನ್ನ ಕೆಲಸ: ನಿಮ್ಮ ಮಾತು ಕೇಳುವುದು, ಕೋಡ್ ಬರೆದುಕೊಡುವುದು, ಗ್ಯಾಲರಿ/ಫೈಲ್ ಆಯ್ಕೆ ಮಾಡುವುದು, Instagram/YouTube/Facebook/WhatsApp ತೆರೆಯುವುದು, ಹಿಂದಕ್ಕೆ ಹೋಗುವುದು ಮತ್ತು ನೀವು ಸರ್ಚ್ ಮಾಡಲು ಹೇಳಿದಾಗ Google Search ತೆರೆಯುವುದು.";
    }

    if (low.includes("ಹಿಂದಕ್ಕೆ") || low.includes("ಬ್ಯಾಕ್") || low.includes("back")) {
      setTimeout(() => history.back(), 400);
      return "ಹಿಂದಕ್ಕೆ ಬರುತ್ತಿದ್ದೇನೆ.";
    }

    if (low.includes("ನಿಲ್ಲಿಸು") || low.includes("stop")) {
      continuousMode = false;
      autoBtn.classList.remove("btn-red");
      autoBtn.classList.add("btn-green");
      if (rec) rec.stop();
      return "ನಿರಂತರ ಕೇಳುವಿಕೆಯನ್ನು ನಿಲ್ಲಿಸಿದ್ದೇನೆ.";
    }

    if (low.includes("ಗ್ಯಾಲರಿ") || low.includes("ಅಪ್ಲೋಡ್") || low.includes("upload") || low.includes("ಪೋಸ್ಟ್")) {
      document.getElementById("filePick").click();
      if (low.includes("instagram") || low.includes("ಇನ್ಸ್ಟಾಗ್ರಾಂ")) {
        window.open("https://www.instagram.com/", "_blank");
        return "ಗ್ಯಾಲರಿ ಫೈಲ್ ಆಯ್ಕೆ ತೆರೆದಿದ್ದೇನೆ ಮತ್ತು Instagram ಕೂಡ ತೆರೆದಿದ್ದೇನೆ. ಅಲ್ಲಿ ನಿಮ್ಮ ಪೋಸ್ಟ್ ಅಪ್ಲೋಡ್ ಮಾಡಬಹುದು.";
      }
      return "ಗ್ಯಾಲರಿ / ಫೈಲ್ ಆಯ್ಕೆ ತೆರೆದಿದ್ದೇನೆ. ನಿಮ್ಮ ಪೋಸ್ಟ್ ಅಥವಾ ಫೈಲ್ ಆಯ್ಕೆ ಮಾಡಿ.";
    }

    if (low.includes("instagram") || low.includes("ಇನ್ಸ್ಟಾಗ್ರಾಂ")) {
      window.open("https://www.instagram.com/", "_blank");
      return "Instagram ತೆರೆದಿದ್ದೇನೆ.";
    }
    if (low.includes("youtube") || low.includes("ಯೂಟ್ಯೂಬ್")) {
      window.open("https://studio.youtube.com", "_blank");
      return "YouTube Studio ತೆರೆದಿದ್ದೇನೆ.";
    }
    if (low.includes("facebook") || low.includes("ಫೇಸ್ಬುಕ್")) {
      window.open("https://www.facebook.com/", "_blank");
      return "Facebook ತೆರೆದಿದ್ದೇನೆ.";
    }
    if (low.includes("whatsapp") || low.includes("ವಾಟ್ಸಾಪ್")) {
      window.open("https://web.whatsapp.com/", "_blank");
      return "WhatsApp ತೆರೆದಿದ್ದೇನೆ.";
    }

    if (low.includes("ಕೋಡ್") || low.includes("ಕೋಡ್ದು") || low.includes("ಕೊಡ") || low.includes("code") || low.includes("ತಯಾರಿಸಲು")) {
      return buildAppCode(userText);
    }

    if (low.includes("ಸರ್ಚ್") || low.includes("ಹುಡುಕು") || low.includes("search") || low.includes("google")) {
      const q = userText.replace(/(ಸರ್ಚ್ ಮಾಡು|ಹುಡುಕು|search|google|ಸರ್ಚ್)/gi, "").trim() || userText;
      window.open("https://www.google.com/search?q=" + encodeURIComponent(q), "_blank");
      return `"${q}" ಬಗ್ಗೆ Google Search ತೆರೆದಿದ್ದೇನೆ.`;
    }

    return `ನಾನು ನಿಮ್ಮ ಮಾತನ್ನು ಕೇಳಿದೆ: "${userText}". ಕೋಡ್ ಬೇಕಿದ್ದರೆ 'ಕೋಡ್ ಬರಿ', ಗ್ಯಾಲರಿ/Instagram ತೆರೆಯಲು 'Instagram ಓಪನ್ ಮಾಡು ಮತ್ತು ಅಪ್ಲೋಡ್', ಅಥವಾ ಹುಡುಕಲು 'ಸರ್ಚ್ ಮಾಡು ...' ಎಂದು ಹೇಳಿ.`;
  }

  function sendText(spokenOrTyped = null) {
    const text = (spokenOrTyped ?? inp.value).trim();
    if (!text) return;
    if (!spokenOrTyped) inp.value = "";

    memory.push({ role: "user", text });
    save();
    addMsg("user", text);

    const ans = processCommand(text);
    reply(ans);
  }

  function startListen() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      alert("Google Chrome ಬಳಸಿ.");
      return;
    }
    if (isSpeaking) return;

    try {
      if (rec) rec.abort();
      rec = new SR();
      rec.lang = "kn-IN";
      rec.interimResults = false;
      rec.continuous = false;

      rec.onstart = () => {
        statusText.textContent = "👂 ಕೇಳುತ್ತಿದ್ದೇನೆ... ಮಾತನಾಡಿ";
        micBtn.classList.add("btn-red");
      };
      rec.onresult = (e) => {
        const heard = e.results[0][0].transcript;
        sendText(heard);
      };
      rec.onerror = () => {
        micBtn.classList.remove("btn-red");
        if (continuousMode && !isSpeaking) {
          setTimeout(() => startListen(), 700);
        }
      };
      rec.onend = () => {
        micBtn.classList.remove("btn-red");
        if (continuousMode && !isSpeaking) {
          setTimeout(() => startListen(), 500);
        }
      };
      rec.start();
    } catch (_) {}
  }

  function startOnce() {
    continuousMode = false;
    autoBtn.classList.remove("btn-red");
    autoBtn.classList.add("btn-green");
    startListen();
  }

  function toggleContinuous() {
    continuousMode = !continuousMode;
    if (continuousMode) {
      autoBtn.classList.remove("btn-green");
      autoBtn.classList.add("btn-red");
      statusText.textContent = "🔁 ನಿರಂತರ ಮೋಡ್ ಆನ್ ಆಗಿದೆ";
      startListen();
    } else {
      autoBtn.classList.remove("btn-red");
      autoBtn.classList.add("btn-green");
      statusText.textContent = "ನಿರಂತರ ಮೋಡ್ ಆಫ್ ಆಗಿದೆ";
      if (rec) rec.stop();
    }
  }

  window.addEventListener("load", () => {
    memory.forEach(m => addMsg(m.role, m.text));
    const welcome = "ನಮಸ್ಕಾರ! ನಾನು ನಿರಂತರವಾಗಿ ಕೆಲಸ ಮಾಡುವ ರೋಬೋಟ್. ಕೋಡ್ ಬರೆದುಕೊಡುತ್ತೇನೆ, ಗ್ಯಾಲರಿ/Instagram ತೆರೆಯುತ್ತೇನೆ ಮತ್ತು ಹೇಳಿದ ಕೆಲಸ ಮಾಡುತ್ತೇನೆ.";
    addMsg("bot", welcome);
  });
</script>
</body>
</html>
