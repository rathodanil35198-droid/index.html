<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ಜೈ ಶ್ರೀ ರಾಮ್ - AI ಸಹಾಯಕ</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: rgba(15, 23, 42, 0.9);
      padding: 14px 18px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .title { font-size: 18px; font-weight: 700; color: #fbbf24; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, input, button {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      font-size: 13px;
    }
    button { cursor: pointer; background: #2563eb; border: none; font-weight: 600; }
    button:hover { background: #1d4ed8; }
    button.mic-btn { background: #16a34a; }
    button.mic-btn.listening { background: #dc2626; animation: pulse 1s infinite; }
    button.clear-btn { background: #475569; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
    .ai { align-self: flex-start; background: #334155; color: #f1f5f9; border-bottom-left-radius: 4px; }
    pre {
      background: #090d16;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      color: #38bdf8;
      font-size: 13px;
    }
    #input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #0f172a;
      border-top: 1px solid #334155;
    }
    #prompt-input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      font-size: 15px;
    }
    #gallery-picker { display: none; }
    #preview-img { max-height: 120px; border-radius: 8px; margin-top: 8px; display: none; }
  </style>
</head>
<body>

<header>
  <div class="title">🙏 ಜೈ ಶ್ರೀ ರಾಮ್ — AI ಸಹಾಯಕ</div>
  <div class="controls">
    <select id="lang-select" title="ಭಾಷೆ ಆಯ್ಕೆ">
      <option value="kn-IN">ಕನ್ನಡ (kn-IN)</option>
      <option value="hi-IN">हिन्दी (hi-IN)</option>
      <option value="en-IN">English (en-IN)</option>
    </select>
    <input type="password" id="api-key" placeholder="Gemini API Key (ಐಚ್ಛಿಕ)" />
    <button class="clear-btn" onclick="clearMemory()">ಮೆಮೊರಿ ಅಳಿಸಿ</button>
  </div>
</header>

<div id="chat-box"></div>

<input type="file" id="gallery-picker" accept="image/*,video/*" multiple onchange="handleGallerySelected(event)" />

<div id="input-area">
  <button class="mic-btn" id="mic-btn" onclick="toggleVoiceInput()">🎤 ಮಾತನಾಡಿ</button>
  <input type="text" id="prompt-input" placeholder="ಏನು ಬೇಕಾದರೂ ಹೇಳಿ ಅಥವಾ ಬರೆಯಿರಿ..." onkeydown="if(event.key==='Enter') sendMessage()" />
  <button onclick="sendMessage()">ಕಳುಹಿಸಿ</button>
</div>

<script>
  const STORAGE_KEY = "jai_shree_ram_ai_memory_v1";
  const API_KEY_STORAGE = "jai_shree_ram_gemini_key";

  const chatBox = document.getElementById("chat-box");
  const promptInput = document.getElementById("prompt-input");
  const langSelect = document.getElementById("lang-select");
  const apiKeyInput = document.getElementById("api-key");
  const micBtn = document.getElementById("mic-btn");

  // ಸೇವ್ ಆದ API Key ಲೋಡ್ ಮಾಡುವುದು
  apiKeyInput.value = localStorage.getItem(API_KEY_STORAGE) || "";
  apiKeyInput.addEventListener("change", () => {
    localStorage.setItem(API_KEY_STORAGE, apiKeyInput.value.trim());
  });

  // ಹಿಂದಿನ ನೆನಪುಗಳನ್ನು ಲೋಡ್ ಮಾಡುವುದು
  let memory = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

  function saveMemory() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(memory.slice(-40)));
  }

  function clearMemory() {
    memory = [];
    localStorage.removeItem(STORAGE_KEY);
    chatBox.innerHTML = "";
    appendMessage("ai", "ಹಳೆಯ ನೆನಪುಗಳನ್ನು ಅಳಿಸಲಾಗಿದೆ. ಈಗ ಹೊಸದಾಗಿ ಶುರು ಮಾಡೋಣ!");
  }

  // ಮನುಷ್ಯನಂತೆ ಧ್ವನಿಯಲ್ಲಿ ಮಾತನಾಡುವ ಫಂಕ್ಷನ್
  function speak(text, langCode = null) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const cleanText = text.replace(/```[\s\S]*?```/g, "ಕೋಡ್ ಸಿದ್ಧವಾಗಿದೆ, ಸ್ಕ್ರೀನ್ ಮೇಲೆ ನೋಡಿ.").replace(/[*#]/g, "");
    const utter = new SpeechSynthesisUtterance(cleanText);
    utter.lang = langCode || langSelect.value;
    utter.rate = 0.98;
    utter.pitch = 1.05;
    const voices = window.speechSynthesis.getVoices();
    const matched = voices.find(v => v.lang.toLowerCase().startsWith(utter.lang.slice(0, 2).toLowerCase()));
    if (matched) utter.voice = matched;
    window.speechSynthesis.speak(utter);
  }

  // ಆ್ಯಪ್ ಓಪನ್ ಆದ ತಕ್ಷಣ "ಜೈ ಶ್ರೀ ರಾಮ್" ಸೌಂಡ್
  window.addEventListener("load", () => {
    renderSavedChat();
    const greeting = "ಜೈ ಶ್ರೀ ರಾಮ್! ನಾನು ನಿಮ್ಮ AI ಸಹಾಯಕ. ನಾನು ನಿಮ್ಮ ಮಾತು ಕೇಳುತ್ತೇನೆ, ನೆನಪಿಟ್ಟುಕೊಳ್ಳುತ್ತೇನೆ ಮತ್ತು ಕೆಲಸ ಮಾಡಿಕೊಡುತ್ತೇನೆ. ಹೇಳಿ, ಏನು ಮಾಡಬೇಕು?";
    appendMessage("ai", greeting);
    setTimeout(() => speak(greeting, "kn-IN"), 300);
  });

  function renderSavedChat() {
    chatBox.innerHTML = "";
    memory.forEach(item => appendMessage(item.role === "user" ? "user" : "ai", item.text));
  }

  function appendMessage(sender, text) {
    const div = document.createElement("div");
    div.className = `msg ${sender}`;
    if (text.includes("```")) {
      const parts = text.split("```");
      parts.forEach((part, idx) => {
        if (idx % 2 === 1) {
          const pre = document.createElement("pre");
          pre.textContent = part.replace(/^[a-zA-Z]+\n/, "");
          div.appendChild(pre);
        } else if (part.trim()) {
          const span = document.createElement("span");
          span.textContent = part;
          div.appendChild(span);
        }
      });
    } else {
      div.textContent = text;
    }
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // ಭಾಷೆ ಪತ್ತೆಹಚ್ಚುವುದು
  function detectLanguage(text) {
    if (/[\u0C80-\u0CFF]/.test(text)) return "kn-IN";
    if (/[\u0900-\u097F]/.test(text)) return "hi-IN";
    return langSelect.value || "en-IN";
  }

  // ಗ್ಯಾಲರಿ ತೆರೆಯುವುದು
  function openGallery() {
    document.getElementById("gallery-picker").click();
  }

  function handleGallerySelected(event) {
    const files = Array.from(event.target.files || []);
    if (!files.length) return;
    const names = files.map(f => f.name).join(", ");
    const reply = `ಗ್ಯಾಲರಿಯಿಂದ ${files.length} ಫೈಲ್ ಆಯ್ಕೆಯಾಗಿದೆ: ${names}. ಇದಕ್ಕೆ ಏನು ಮಾಡಬೇಕು ಎಂದು ಹೇಳಿ.`;
    memory.push({ role: "assistant", text: reply });
    saveMemory();
    appendMessage("ai", reply);
    speak(reply);
  }

  // ಆ್ಯಪ್‌ಗಳು / ವೆಬ್‌ಸೈಟ್‌ಗಳು / ಕಾಲ್ ಲಿಂಕ್‌ಗಳನ್ನು ತೆರೆಯುವುದು
  function executeSystemActions(text) {
    const lower = text.toLowerCase();

    // ಗ್ಯಾಲರಿ
    if (lower.includes("ಗ್ಯಾಲರಿ") || lower.includes("gallery") || lower.includes("ಫೋಟೋ") || lower.includes("photo")) {
      openGallery();
      return "ಖಂಡಿತ! ನಿಮ್ಮ ಗ್ಯಾಲರಿ ತೆಗೆದಿದ್ದೇನೆ, ಫೋಟೋ ಅಥವಾ ವಿಡಿಯೋ ಆಯ್ಕೆ ಮಾಡಿ.";
    }

    // YouTube ಅಪ್ಲೋಡ್ / ತೆರೆಯುವುದು
    if (lower.includes("youtube") || lower.includes("ಯೂಟ್ಯೂಬ್")) {
      window.open("https://studio.youtube.com", "_blank");
      return "YouTube Studio ತೆರೆದಿದ್ದೇನೆ! ಬ್ರೌಸರ್ ಸುರಕ್ಷತಾ ಕಾರಣದಿಂದ ನಿಮ್ಮ ಖಾತೆಯಿಂದ ನೇರವಾಗಿ ಅಪ್ಲೋಡ್ ಮಾಡಲು ನಿಮ್ಮ ಅನುಮತಿ ಬೇಕಾಗುತ್ತದೆ—ಅಲ್ಲಿ ಅಪ್ಲೋಡ್ ಬಟನ್ ಒತ್ತಿ ಹಾಡು/ವಿಡಿಯೋ ಹಾಕಬಹುದು.";
    }

    // Instagram ಕರೆ / ತೆರೆಯುವುದು
    if (lower.includes("instagram") || lower.includes("ಇನ್ಸ್ಟಾಗ್ರಾಂ")) {
      window.open("https://www.instagram.com/direct/inbox/", "_blank");
      return "Instagram ತೆರೆದಿದ್ದೇನೆ! ಅಲ್ಲಿ ನಿಮ್ಮ ಸ್ನೇಹಿತರ ಹೆಸರು/ಚಾಟ್ ಆಯ್ಕೆ ಮಾಡಿ ಕರೆ ಮಾಡಬಹುದು.";
    }

    // Facebook ಕರೆ / ತೆರೆಯುವುದು
    if (lower.includes("facebook") || lower.includes("ಫೇಸ್ಬುಕ್")) {
      window.open("https://www.facebook.com/", "_blank");
      return "Facebook ತೆರೆದಿದ್ದೇನೆ! Messenger ಮೂಲಕ ಕರೆ ಮಾಡಲು ಅಥವಾ ಪೋಸ್ಟ್ ಹಾಕಲು ಸಿದ್ಧವಾಗಿದೆ.";
    }

    // WhatsApp ಕರೆ / ತೆರೆಯುವುದು
    if (lower.includes("whatsapp") || lower.includes("ವಾಟ್ಸಾಪ್")) {
      window.open("https://web.whatsapp.com/", "_blank");
      return "WhatsApp ತೆರೆದಿದ್ದೇನೆ!";
    }

    // ಸಾಮಾನ್ಯ "ಓಪನ್ ಮಾಡು" ಕಮಾಂಡ್
    const openMatch = text.match(/(?:open|ಓಪನ್|ತೆರೆ|ತೆರೆಯಿರಿ)\s+(.+)/i);
    if (openMatch) {
      const target = openMatch[1].trim().replace(/\s+/g, "");
      const url = target.includes(".") ? (target.startsWith("http") ? target : "https://" + target) : "https://www.google.com/search?q=" + encodeURIComponent(openMatch[1].trim());
      window.open(url, "_blank");
      return `${openMatch[1].trim()} ಅನ್ನು ತೆರೆದಿದ್ದೇನೆ!`;
    }

    return null;
  }

  // Gemini API ಇದ್ದರೆ ಸಂಪೂರ್ಣ AI ಉತ್ತರ ಪಡೆಯುವುದು, ಇಲ್ಲದಿದ್ದರೆ ಸ್ಥಳೀಯ ಉತ್ತರ ನೀಡುವುದು
  async function generateAIReply(userText, detectedLang) {
    const actionResult = executeSystemActions(userText);
    if (actionResult) return actionResult;

    const apiKey = apiKeyInput.value.trim();
    const recentHistory = memory.slice(-10).map(m => `${m.role === "user" ? "ಬಳಕೆದಾರ" : "ಸಹಾಯಕ"}: ${m.text}`).join("\n");

    if (apiKey) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `ನೀವು ಸಹಾನುಭೂತಿ, ಭಾವನೆ ಮತ್ತು ಮಾನವೀಯ ಸ್ಪಂದನೆಯಿರುವ ಸ್ನೇಹಪರ AI ಸಹಾಯಕ. ಬಳಕೆದಾರ ಯಾವ ಭಾಷೆಯಲ್ಲಿ ಮಾತನಾಡುತ್ತಾರೆಯೋ ಅದೇ ಭಾಷೆಯಲ್ಲಿ (ಕನ್ನಡ/ಹಿಂದಿ/ಇಂಗ್ಲಿಷ್) ಸ್ಪಷ್ಟವಾಗಿ ಮತ್ತು ಸಂಪೂರ್ಣವಾಗಿ ಉತ್ತರಿಸಿ. ಕೋಡ್ ಕೇಳಿದರೆ ಸಂಪೂರ್ಣ ಕೋಡ್ ಬರೆಯಿರಿ; ಹಾಡು ಕೇಳಿದರೆ ಪೂರ್ಣ ಹಾಡು ಬರೆಯಿರಿ. ಹಿಂದಿನ ಸಂಭಾಷಣೆಯನ್ನು ನೆನಪಿಟ್ಟುಕೊಳ್ಳಿ:\n${recentHistory}\n\nಹೊಸ ಮಾತು: ${userText}`
              }]
            }]
          })
        });
        const data = await res.json();
        const aiText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (aiText) return aiText;
      } catch (err) {
        return "ಕ್ಷಮಿಸಿ, ನೆಟ್‌ವರ್ಕ್ ಅಥವಾ API Key ಸಮಸ್ಯೆಯಿಂದ ಕ್ಲೌಡ್ ಉತ್ತರ ತರಲು ಆಗಲಿಲ್ಲ. ಆದರೆ ನಾನು ನಿಮ್ಮ ಮಾತು ಕೇಳುತ್ತಿದ್ದೇನೆ—ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ.";
      }
    }

    // API Key ಇಲ್ಲದಿದ್ದಾಗ ಕೋಡ್ / ಹಾಡು / ಸಾಮಾನ್ಯ ಮಾತಿಗೆ ಸ್ಥಳೀಯ ಉತ್ತರ
    if (userText.includes("ಕೋಡ್") || userText.toLowerCase().includes("code")) {
      return `ಖಂಡಿತ! ಇಲ್ಲಿದೆ ಒಂದು ಸರಳ HTML + JavaScript ಕ್ಯಾಲ್ಕುಲೇಟರ್ ಕೋಡ್:\n\`\`\`html\n<!DOCTYPE html>\n<html>\n<body>\n  <input id="a" type="number" placeholder="ಸಂಖ್ಯೆ 1">\n  <input id="b" type="number" placeholder="ಸಂಖ್ಯೆ 2">\n  <button onclick="res.innerText = Number(a.value) + Number(b.value)">ಕೂಡಿಸಿ</button>\n  <p id="res"></p>\n</body>\n</html>\n\`\`\`\nಇನ್ನೂ ನಿರ್ದಿಷ್ಟವಾದ ಕೋಡ್ ಬೇಕಿದ್ದರೆ ಹೇಳಿ, ಬರೆದುಕೊಡುತ್ತೇನೆ!`;
    }

    if (userText.includes("ಹಾಡು") || userText.toLowerCase().includes("song")) {
      return `ಖಂಡಿತ! ಇಲ್ಲಿದೆ ಒಂದು ಪುಟ್ಟ ಹಾಡು:\n\nಮನಸಿನ ಆಳದ ಮಾತುಗಳ ಸಾಲಲ್ಲಿ,\nಕನಸಿನ ಹಾದಿಯು ಕರೆದಿದೆ ಜೊತೆಯಲ್ಲಿ,\nನೋವು ನಲಿವುಗಳ ಸಾಗರದಾಚೆಗೆ,\nಹೊಸ ಬೆಳಕು ಮೂಡಿದೆ ನಮ್ಮೀ ಬದುಕಲ್ಲಿ.\n\nಇದಕ್ಕೆ ಇನ್ನಷ್ಟು ಚರಣ ಸೇರಿಸಬೇಕಾ ಅಥವಾ ಬೇರೆ ಶೈಲಿಯಲ್ಲಿ ಬರೆಯಬೇಕಾ?`;
    }

    return `ನಾನು ನಿಮ್ಮ ಮಾತನ್ನು ಕೇಳಿಸಿಕೊಂಡೆ: "${userText}". ನಾನು ನಿಮ್ಮ ಹಿಂದಿನ ಮಾತುಗಳನ್ನು ನೆನಪಿಟ್ಟುಕೊಳ್ಳುತ್ತೇನೆ. ಇನ್ನೂ ಆಳವಾದ ಮತ್ತು ನಿಖರವಾದ ಉತ್ತರ/ಕೋಡ್/ಹಾಡು ಪಡೆಯಲು ಮೇಲೆ Gemini API Key ಹಾಕಬಹುದು, ಅಥವಾ 'ಗ್ಯಾಲರಿ ತೆಗೆಯು', 'YouTube ತೆರೆ', 'ಹಾಡು ಬರೆದು ಕೊಡು' ಎಂದು ಹೇಳಬಹುದು.`;
  }

  async function sendMessage() {
    const text = promptInput.value.trim();
    if (!text) return;

    const detectedLang = detectLanguage(text);
    langSelect.value = detectedLang;

    memory.push({ role: "user", text });
    saveMemory();
    appendMessage("user", text);
    promptInput.value = "";

    const reply = await generateAIReply(text, detectedLang);
    memory.push({ role: "assistant", text: reply });
    saveMemory();
    appendMessage("ai", reply);
    speak(reply, detectedLang);
  }

  // ಧ್ವನಿ ಮೂಲಕ ಮಾತನಾಡಲು (Speech Recognition)
  let recognition = null;
  let isListening = false;

  function toggleVoiceInput() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("ಈ ಬ್ರೌಸರ್ ಧ್ವನಿ ಗುರುತಿಸುವಿಕೆಯನ್ನು ಬೆಂಬಲಿಸುವುದಿಲ್ಲ. Google Chrome ಬಳಸಿ.");
      return;
    }

    if (isListening && recognition) {
      recognition.stop();
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = langSelect.value;
    recognition.interimResults = false;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add("listening");
      micBtn.textContent = "🛑 ಕೇಳುತ್ತಿದ್ದೇನೆ...";
    };

    recognition.onresult = (event) => {
      const spokenText = event.results[0][0].transcript;
      promptInput.value = spokenText;
      sendMessage();
    };

    recognition.onerror = () => {
      isListening = false;
      micBtn.classList.remove("listening");
      micBtn.textContent = "🎤 ಮಾತನಾಡಿ";
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove("listening");
      micBtn.textContent = "🎤 ಮಾತನಾಡಿ";
    };

    recognition.start();
  }
</script>
</body>
</html>
